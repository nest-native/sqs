name: Bug report
description: Report a reproducible problem in @nest-native/sqs.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please include enough detail for maintainers to reproduce it without guessing about your Nest, SQS, queue, or consumer/producer setup.
        Do not paste secrets, AWS access keys, session tokens, account IDs you consider private, queue policies, customer data, or unredacted queue URLs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Link to a minimal repo or paste the smallest code snippet that demonstrates the issue.
      placeholder: |
        SqsModule.forRoot({
          client: { region: 'eu-west-1' },
          queues: { orders: 'orders' },
        });
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: "@nest-native/sqs version"
      placeholder: "0.0.0"
    validations:
      required: true
  - type: input
    id: nest-version
    attributes:
      label: NestJS version
      placeholder: "11.x"
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: "@aws-sdk/client-sqs version"
      placeholder: "3.x"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SqsModule registration
        - "@SqsHandler"
        - parameter decorators (@SqsMessage/@SqsAttributes/@SqsCtx/@SqsRawMessage)
        - producer service
        - guards/pipes/interceptors/filters
        - visibility, deletion, or redelivery
        - error mapping or retry backoff
        - emulators (ElasticMQ, LocalStack)
        - samples or docs
        - release or CI
        - other
    validations:
      required: true
  - type: textarea
    id: consumer-setup
    attributes:
      label: Consumer or producer setup, if relevant
      description: Mention the queue type (standard or FIFO), whether the issue is on consume or produce, the concurrency, and the queue's VisibilityTimeout and RedrivePolicy.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste stack traces or command output. Redact secrets, tokens, account IDs, queue URLs, and credentials.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed or redacted secrets, AWS credentials, and private queue URLs.
          required: true
        - label: I checked the docs and samples for the same pattern.
          required: true
